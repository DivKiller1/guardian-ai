global
    log stdout format raw local0
    # Enable the Runtime API via TCP socket
    stats socket :9999 level admin expose-fd listeners
    stats timeout 30s

defaults
    log global
    mode http
    option httplog
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend ddos_frontend
    bind *:8080
    
    # Define a stick-table for DDoS protection
    # Stores IP addresses and tracks connection rates
    stick-table type ip size 1m expire 5m store conn_rate(10s)
    
    # Explicitly name the table for easier reference in commands
    # (Actually HAProxy uses the proxy name as the table name by default if not specified)
    # But we'll use 'ddos_protection' as a dummy proxy to host the table if needed.
    
    # Track the current IP
    tcp-request content track-sc0 src
    
    # If the IP is in the table and exceeds a rate (set dynamically by AI), block it
    # The 'conn_rate' will be checked against values we set via the API
    http-request deny if { src_conn_rate(ddos_frontend) gt 100 }

    default_backend api_servers

backend api_servers
    balance roundrobin
    server backend1 backend-api1:5000 check
    server backend2 backend-api2:5000 check
    server backend3 backend-api3:5000 check

# Dummy proxy to host the named table 'ddos_protection'
backend ddos_protection
    stick-table type ip size 1m expire 5m store conn_rate(10s)
